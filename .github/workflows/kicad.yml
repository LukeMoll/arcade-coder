name: KiCad

on:
  push:
  workflow_dispatch:

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - run: "mkdir -p docs/"
      - uses: actions-for-kicad/setup-kicad@v1
        with:
          version: "8.0"
      - uses: actions-for-kicad/generate-kicad-files@v1
        with:
          file: "./schematic/arcade-coder.kicad_sch"
          type: "schematic_svg"
          black-and-white: false
      - run: "mv arcade-coder.svg docs/"
      - name: Commit docs/
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add docs/
          git commit -m "Updated auto-generated files in docs/"
          git push
      
